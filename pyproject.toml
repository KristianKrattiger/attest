[project]
name = "attest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["messy: the long messy-firm run; writes firm/lab/messy-summary.md (run with: pytest -m messy)"]
addopts = "-m 'not messy'"
